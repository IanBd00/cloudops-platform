name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

      - name: Create dynamic inventory
        run: |
          echo "[aws]" > ansible/inventory/hosts.ini
          echo "ec2-server ansible_host=${{ secrets.EC2_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key.pem" >> ansible/inventory/hosts.ini

      - name: Run deploy playbook
        run: ansible-playbook ansible/playbooks/deploy-app.yml