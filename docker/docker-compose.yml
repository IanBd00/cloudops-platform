services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: cloudops-app
    ports:
      - "8000:8000"
    networks:
      - cloudops-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudops-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cloudops-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: cloudops-loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - cloudops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudops-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - cloudops-net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  npm:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: cloudops-npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"       # UI de administração
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - cloudops-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: cloudops-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cloudops-net
    depends_on:
      - loki
    restart: unless-stopped

networks:
  cloudops-net:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  npm-data:
  npm-letsencrypt: